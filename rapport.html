<style>
:root{--ink:#676B6D;--muted:#676B6D;--line:#d9dadb;--blue:#0077C8;--blue-soft:#e6f1fa;--ok:#2f7d4f;--bad:#b8402f;--bg:#f7f7f7}
*{box-sizing:border-box}body{letter-spacing:.025em;font-synthesis:none}body{margin:0;background:var(--bg);font-family:'Lato',sans-serif;color:var(--ink);font-size:14px;line-height:1.5}
.bar{max-width:820px;margin:16px auto 0;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar a,.bar button{font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none}
.vb{max-width:820px;margin:12px auto 0;padding:0 16px}.vb div{background:#fbf1dc;color:#7a5410;border-radius:12px;padding:10px 14px;font-size:13px}
.doc{max-width:820px;margin:12px auto 32px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:48px 56px;position:relative;overflow:hidden}
.wm{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-28deg);font-family:'Share Tech',sans-serif;font-size:110px;font-weight:700;color:rgba(31,111,209,.06);pointer-events:none;white-space:nowrap}
.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:18px;gap:20px}
.hd img{height:46px}.hd .r{text-align:right;font-size:12.5px;color:var(--muted)}.hd .r b{display:block;font-family:'Share Tech',sans-serif;font-size:20px;color:var(--ink)}
h1{font-family:'Share Tech',sans-serif;font-size:26px;margin:26px 0 4px}.sub{color:var(--muted);margin:0 0 22px}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px;margin-bottom:22px}
.meta div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.meta span{color:var(--muted)}.meta b{font-weight:600;text-align:right}
h2{font-family:'Share Tech',sans-serif;font-size:17px;margin:24px 0 8px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1.5px solid var(--ink);padding:8px 6px}td{padding:9px 6px;border-bottom:1px solid var(--line)}td.n{text-align:right;font-variant-numeric:tabular-nums}
.res{display:flex;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:6px}.res .d{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
.con{background:var(--bg);border-radius:10px;padding:14px 16px;margin-top:18px}
.ft{display:flex;justify-content:space-between;gap:20px;margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.msg{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
@media(max-width:640px){.doc{padding:28px 20px}.meta{grid-template-columns:1fr}.wm{font-size:64px}}
@media print{body{background:#fff}.bar,.vb{display:none}.doc{border:0;margin:0;max-width:none;padding:0}}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nl(n,d){if(d===undefined)d=1;if(n===null||n===undefined||n===''||isNaN(n))return '–';return Number(n).toFixed(d).replace('.',',');}
function dmy(s){return s?s.slice(8,10)+'-'+s.slice(5,7)+'-'+s.slice(0,4):'–';}
var Q=new URLSearchParams(location.search), KC=(Q.get('c')||'').replace(/[^A-Za-z0-9-]/g,'').toLowerCase(), code=(Q.get('p')||'').replace(/[^A-Za-z0-9]/g,''), rap=Q.get('r')||'', k=Q.get('k')==='pcr'?'pcr':'pot';
function fout(t){document.getElementById('m').innerHTML='<div class="msg"><b style="display:block;color:#676B6D;font-size:18px;margin-bottom:4px">Rapport niet gevonden</b>'+esc(t)+'</div>';}
function meta(a){return '<div class="meta">'+a.map(function(x){return '<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>';}).join('')+'</div>';}
function render(P){
  var lot=null; P.lots.forEach(function(x){ if(x.rapport===rap) lot=x; });
  var eind=P.m&&P.m.rapport===rap?P.m:null; var src=eind||lot; if(!src) return fout('Dit rapport hoort niet bij deze batch.');
  var cbd=P.cat==='CBD', ond=eind?esc(P.product)+' (eindproduct, batch '+esc(P.id)+')':esc(lot.type)+(P.id?' (grondstof voor batch '+esc(P.id)+')':' (grondstof, partij '+esc(lot.id||'')+')');
  var titel=k==='pcr'?'PCR-test cannabis-RNA':(eind?'Analyse cannabinoïden per stuk':'Analyse cannabinoïden');
  var body='';
  if(k==='pcr'){
    var pos=src.pcr==='Positief';
    body='<h2>Resultaat</h2><div class="res"><div class="d" style="background:'+(pos?'var(--ok)':'var(--bad)')+'">'+(pos?'+':'–')+'</div><div><b style="font-size:16px">Cannabis-RNA '+(pos?'aangetoond':'niet aangetoond')+'</b><div style="color:var(--muted);font-size:13px">Ct-waarde '+nl(src.ct)+' · drempel voor positief: Ct ≤ 35</div></div></div>'+
    '<h2>Methode</h2><table><tr><th>Onderdeel</th><th>Gegevens</th></tr><tr><td>Techniek</td><td>RT-qPCR, cannabis-specifiek doelwit</td></tr><tr><td>Extractie</td><td>RNA-extractie uit gehomogeniseerd monster</td></tr><tr><td>Controles</td><td>Positieve, negatieve en extractiecontrole binnen specificatie</td></tr></table>'+
    '<div class="con"><b>Conclusie.</b> '+(pos?'Het monster bevat genetisch materiaal van de cannabisplant. Dit past bij een product gemaakt van plantaardig materiaal (Opiumwet Lijst II) en niet bij een geïsoleerd solvent-extract.':'In het monster is geen cannabis-RNA aangetoond.')+'</div>';
  } else if(eind){
    body='<h2>Resultaten per stuk</h2><table><tr><th>Component</th><th style="text-align:right">Gemeten</th><th style="text-align:right">Etiket</th></tr>'+
      (cbd?'<tr><td>CBD</td><td class="n">'+nl(src.cbdmg)+' mg</td><td class="n">'+esc(P.label)+' mg</td></tr><tr><td>Δ9-THC + THCA</td><td class="n">'+(src.mg?nl(src.mg,2)+' mg':'niet aangetoond')+'</td><td class="n">≤ '+nl(P.cbdThcMax,2)+' mg</td></tr>'
          :'<tr><td>THC totaal (Δ9-THC + THCA)</td><td class="n">'+nl(src.mg)+' mg</td><td class="n">'+esc(P.label)+' mg</td></tr>')+
      '</table><h2>Methode</h2><table><tr><th>Onderdeel</th><th>Gegevens</th></tr><tr><td>Techniek</td><td>HPLC-DAD</td></tr><tr><td>Monster</td><td>5 stuks uit begin, midden en eind van de batch</td></tr></table>';
  } else {
    body='<h2>Resultaten</h2><table><tr><th>Component</th><th style="text-align:right">Gehalte</th></tr><tr><td>THC totaal (Δ9-THC + THCA)</td><td class="n">'+nl(src.thc)+' %</td></tr><tr><td>CBD totaal</td><td class="n">'+nl(src.cbd)+' %</td></tr><tr><td>CBN</td><td class="n">'+nl(src.cbn)+' %</td></tr></table>'+
      '<h2>Methode</h2><table><tr><th>Onderdeel</th><th>Gegevens</th></tr><tr><td>Techniek</td><td>GC-FID</td></tr><tr><td>Monster</td><td>Samengevoegd deelmonster uit de bemonsterde verpakkingen</td></tr></table>';
  }
  document.title=titel+' · '+rap;
  document.getElementById('m').innerHTML=
   '<div class="bar">'+(HD?'<button onclick="window.close()">Sluiten</button>':'<a href="./?p='+esc(code)+(KC?'&k='+esc(KC):'')+'">← Terug naar het productpaspoort</a>')+'<button onclick="print()">Opslaan als PDF</button></div>'+
   (P.demo?'<div class="vb"><div><b>Voorbeeldrapport.</b> In gebruik opent hier het originele PDF-rapport van Allora Labs.</div></div>':'')+
   '<div class="doc">'+(P.demo?'<div class="wm">VOORBEELD</div>':'')+'<div class="hd"><img src="'+LOGO+'" alt="Allora Labs"><div class="r"><b>'+esc(rap)+'</b>Testrapport · '+dmy(src.oDatum)+'</div></div>'+
   '<h1>'+titel+'</h1><p class="sub">'+ond+'</p>'+
   meta([['Opdrachtgever','Producent (anoniem)'],['Rapportnummer',esc(rap)],['Product',esc(eind?P.product:lot.type)],(P.id?['Batch',esc(P.id)]:['Partij',esc(lot.id||'')]),['Datum analyse',dmy(src.oDatum)],['Laboratorium','Allora Labs · ISO 9001']])+
   body+'<div class="ft"><span>Allora Labs · ISO 9001-gecertificeerd laboratorium</span><span>Resultaten gelden alleen voor het onderzochte monster.</span></div></div>';
}
var HD=location.hash.indexOf('#d=')===0?location.hash.slice(3):'';
if(HD){ try{ render(JSON.parse(decodeURIComponent(escape(atob(HD))))); }catch(e){ fout('De link is onvolledig.'); } }
else if(!code||!rap) fout('De link is onvolledig.');
else { var laadP=function(){ fetch(API+'?api=paspoort&p='+code,{credentials:'omit',redirect:'follow'}).then(function(r){return r.json();}).then(function(P){if(P.error)fout(P.error);else render(P);}).catch(function(){fout('Geen verbinding. Probeer het opnieuw.');}); };
  fetch('klanten.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(all){ var c=all[KC||'demo']; if(!c) return fout('Deze link hoort bij geen bekende producent.'); if(c.api) API=c.api; laadP(); }).catch(function(){ if(KC) fout('Geen verbinding. Probeer het opnieuw.'); else laadP(); }); }
</script></body></html>
