<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traceability door Allora Labs</title>
<style>
:root{
--bg:#f5f3ee; --card:#fff; --ink:#1d2a2e; --muted:#6b7679; --line:#e4e0d6;
--brand:#14233a; --brand2:#0e1a2c; --gold:#1f6fd1; --gold-soft:#e6effb;
--ok:#2f7d4f; --ok-soft:#e3f2e8; --warn:#b7791f; --warn-soft:#fbf1dc;
--bad:#b8402f; --bad-soft:#f8e3df; --info:#2f5f9e; --info-soft:#e2ebf7; --grey-soft:#eceae4;
--radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{background:var(--brand);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo .fish{width:30px;height:30px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:17px}
.logo small{display:block;font-weight:400;font-size:12px;opacity:.75}
.spacer{flex:1}
.role{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.role button{border:0;background:transparent;color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.role button.on{background:#fff;color:var(--brand);font-weight:600}
.demo-tag{font-size:11px;background:var(--gold);color:#fff;padding:3px 8px;border-radius:6px;font-weight:700;letter-spacing:.04em}
nav{background:var(--brand2);display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav button{background:none;border:0;color:#cfe0e2;padding:11px 14px;cursor:pointer;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:var(--gold);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi{background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--line);cursor:pointer}
.kpi .n{font-size:30px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.amber{border-left:5px solid var(--warn)} .kpi.green{border-left:5px solid var(--ok)} .kpi.red{border-left:5px solid var(--bad)} .kpi.blue{border-left:5px solid var(--info)} .kpi.gold{border-left:5px solid var(--gold)}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:18px}
.two{grid-template-columns:1.3fr 1fr}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:18px 0}
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center;color:var(--ink)}
.act:hover{border-color:var(--brand)}
.act .ic{width:36px;height:36px;border-radius:10px;background:var(--gold-soft);display:grid;place-items:center;font-size:18px;flex:none}
.act b{display:block}
.act span{color:var(--muted);font-size:12px}
.act.locked{opacity:.55}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.c-Quarantaine,.c-Wachtopresultaat{background:var(--warn-soft);color:var(--warn)}
.c-Vrijgegeven,.c-Conform{background:var(--ok-soft);color:var(--ok)}
.c-Afgekeurd,.c-Geblokkeerd,.c-Nietconform{background:var(--bad-soft);color:var(--bad)}
.c-Bemonsterd{background:var(--info-soft);color:var(--info)}
.c-Inafwachting{background:var(--grey-soft);color:#555}
a.id{color:var(--brand);font-weight:600;text-decoration:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;cursor:pointer}
a.id:hover{text-decoration:underline}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-size:14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.gold{background:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pillars{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.pillars{grid-template-columns:1fr}}
.pillar{background:var(--bg);border-radius:10px;padding:12px}
.pillar b{display:block;margin-bottom:4px}
.todo li{margin-bottom:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;margin-top:1px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.wait{background:#b9b4a8}
.chain{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px}
.step .rail{display:flex;flex-direction:column;align-items:center}
.step .rail .b{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px}
.step .rail .ln{flex:1;width:2px;background:var(--line);min-height:14px}
.step .body{padding-bottom:18px}
.minirow{background:var(--bg);border-radius:9px;padding:10px 12px;margin-top:8px}
.qr{width:150px;height:150px}
.qr svg{width:100%;height:100%}
.tracehead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
select,input,textarea{font:inherit;padding:9px 10px;border:1px solid #cfcabd;border-radius:8px;width:100%;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.row2,.row3{grid-template-columns:1fr}}
.modal-bg{position:fixed;inset:0;background:rgba(15,30,34,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto;z-index:20}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:22px}
.modal h2{margin-bottom:4px}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.hint{background:var(--gold-soft);border-radius:9px;padding:10px 12px;font-size:13px;margin-top:12px}
.hint.ok{background:var(--ok-soft)} .hint.bad{background:var(--bad-soft)}
.lotline{display:grid;grid-template-columns:1fr 110px 34px;gap:8px;margin-bottom:6px}
.x{background:none;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90vw}
.toast.show{display:block}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.filter button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
.bar{height:8px;border-radius:5px;background:var(--grey-soft);position:relative;margin-top:6px}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.bar .zone{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ok);border-right:2px dashed var(--ok)}
.empty{color:var(--muted);font-style:italic;padding:8px 0}

header{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.logo img.gf{height:40px;display:block}
.logo .tt{border-left:1px solid var(--line);padding-left:12px;font-size:16px}
.logo .tt small{color:var(--muted);opacity:1}
.by{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.by img{height:34px}
.role{background:var(--grey-soft)} .role button{color:var(--ink)} .role button.on{background:var(--brand);color:#fff}
@media(max-width:700px){.by span{display:none}.by img{height:26px}.logo img.gf{height:36px}.logo .tt{display:none}}
.cs-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:34px;align-items:center;background:linear-gradient(135deg,#eef4fc,#fff);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,44px)}
@media(max-width:860px){.cs-hero{grid-template-columns:minmax(0,1fr)}}
.cs-kicker{color:var(--gold);font-weight:700;font-size:13px;margin-bottom:6px}
.cs-title{font-size:clamp(28px,4vw,42px);line-height:1.08;margin:0 0 14px;text-wrap:balance}
.cs-lead{font-size:16.5px;color:#3d4a4f;max-width:60ch}
.cs-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cs-badges span{background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.phone{justify-self:center;width:300px;max-width:100%;border:11px solid #1d2326;border-radius:38px;background:#fff;box-shadow:0 24px 50px -20px rgba(0,0,0,.35);overflow:hidden}
.phone-in{height:560px;overflow-y:auto}
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow-step{flex:1 1 170px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.flow-step p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.flow-ic{font-size:26px}.flow-n{position:absolute;top:12px;right:14px;color:var(--gold);font-weight:800}
.flow-arrow{align-self:center;color:var(--gold);font-size:22px}
@media(max-width:860px){.flow-arrow{display:none}}
.pp{background:#fff;font-size:14px}
.pp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.pp-head img{height:34px}.pp-lbl{font-size:11px;font-weight:700;color:var(--gold);text-align:right}
.pp-stat{display:flex;gap:12px;align-items:center;padding:14px 16px;margin:12px;border-radius:12px}
.pp-stat.ok{background:var(--ok-soft);color:var(--ok)}.pp-stat.bad{background:var(--bad-soft);color:var(--bad)}.pp-stat.wait{background:var(--warn-soft);color:var(--warn)}
.pp-stat b{display:block;font-size:15px}.pp-stat span{font-size:12px}
.pp-big{width:40px;height:40px;border-radius:50%;background:currentColor;display:grid;place-items:center;flex:none;font-size:20px;font-weight:800}
.pp-big{color:#fff}.pp-stat.ok .pp-big{background:var(--ok)}.pp-stat.bad .pp-big{background:var(--bad)}.pp-stat.wait .pp-big{background:var(--warn)}
.pp-sec{padding:10px 16px;border-top:1px solid var(--line)}
.pp-prod{font-size:18px;font-weight:700}.pp-sub{color:var(--muted);font-size:12.5px}
.pp-h{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.pp-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px}.pp-row span{color:var(--muted)}.pp-row b{text-align:right}.pp-row b.g{color:var(--ok)}.pp-row small{color:var(--muted);font-weight:400;display:block}
.pp-t{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:3px 0}.pp-t i{width:9px;height:9px;border-radius:50%;background:var(--gold)}.pp-t span{color:var(--muted)}
.pp-lab{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--muted)}.pp-lab img{height:30px}
.pp-page{max-width:440px;margin:0 auto}.pp-page .pp{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pp-bar{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
body.pp-mode nav,body.pp-mode header .role{display:none}
body.qr-scan .qr-hide,body.qr-scan footer,body.qr-scan .demo-tag{display:none}

.userbox{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.userbox .btn{padding:6px 12px;font-size:13px}
@media(max-width:600px){.userbox span{display:none}}
.login{max-width:380px;margin:40px auto}
body.auth nav{display:none}
body.busy{cursor:progress} body.busy .modal .btn{opacity:.6;pointer-events:none}

/* ===== Allora-huisstijl ===== */
:root{--bg:#f5f7fb;--card:#fff;--ink:#14233a;--muted:#4a5568;--line:#dde4ee;--gold:#1f6fd1;--gold-soft:#e8f1fc;--grey-soft:#eef2f7;--radius:14px}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px}
h1,h2,.kpi .n,.cs-title,.pp-prod,.act b{font-family:'Space Grotesk','Inter',sans-serif}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600}
header{background:#fff;border-bottom:0;padding:14px 28px}
.logo img.gf{height:38px}
.logo .tt{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:var(--ink)}
.logo .tt small{font-family:'Inter',sans-serif;font-weight:500;font-size:12px}
nav{background:#fff;border-bottom:1px solid var(--line);padding:0 20px;gap:4px}
nav button{color:var(--muted);font-weight:500;padding:12px 12px;border-bottom:2px solid transparent}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
main{max-width:1200px;padding:28px 28px 8px}
.sub{color:var(--muted)}
.card{border-radius:16px;padding:22px;box-shadow:none}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media(min-width:1100px){.kpis{grid-template-columns:repeat(7,1fr)}}
.kpi{border-radius:14px;padding:16px 16px 14px;border:1px solid var(--line);transition:border-color .15s}
.kpi:hover{border-color:var(--gold)}
.kpi.amber,.kpi.green,.kpi.red,.kpi.blue,.kpi.gold{border-left:1px solid var(--line)}
.kpi .n{font-size:30px;font-weight:700;color:var(--ink)}
.kpi .l{display:flex;gap:7px;align-items:baseline;margin-top:4px;line-height:1.3}
.kpi .l:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold);transform:translateY(-1px)}
.kpi.amber .l:before{background:var(--warn)}.kpi.green .l:before{background:var(--ok)}.kpi.red .l:before{background:var(--bad)}.kpi.blue .l:before{background:var(--info)}
.actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}
@media(max-width:900px){.actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.actions{grid-template-columns:minmax(0,1fr)}}
.act{border-radius:14px;padding:14px 16px;gap:14px;min-height:72px}
.act:hover{border-color:var(--gold)}
.act .ic{width:40px;height:40px;border-radius:10px;background:var(--gold-soft)}
.act b{font-weight:600;font-size:15px;color:var(--ink)}
.act span{font-size:13px}
.ico{width:22px;height:22px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.hero{background:var(--brand);color:#fff;border-radius:18px;padding:28px 32px;margin-bottom:22px}
.hero .kick{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7fb3ff;margin-bottom:8px}
.hero h1{color:#fff;font-size:30px;margin:0 0 8px}
.hero .sub{color:#c9d6ea;margin:0;max-width:70ch}
.pillar{background:var(--bg);border-radius:12px;padding:14px}
.btn{border-radius:10px;font-family:inherit}
.btn.ghost{border-color:var(--line);background:#fff}
select,input,textarea{border-color:var(--line);border-radius:10px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--gold-soft);border-color:var(--gold)}
th{color:var(--muted);font-size:11.5px;letter-spacing:.06em}
.filter button{border-color:var(--line);color:var(--ink)}
.filter button.on{background:var(--ink);border-color:var(--ink)}
.step .rail .b{background:var(--gold-soft)}
.step .rail .b .ico{width:17px;height:17px}
.minirow{background:var(--bg)}
.modal{border-radius:18px;padding:26px}
.modal h2{font-size:21px}
.login{max-width:400px;margin:56px auto;padding:30px}
.login h1{font-size:28px}
.cs-hero{background:var(--brand);border:0;color:#fff}
.cs-kicker{color:#7fb3ff;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.cs-title{color:#fff}
.cs-lead{color:#c9d6ea}
.cs-badges span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-weight:500}
.phone{border-color:#0b1424;color:var(--ink)}
.flow-step{border-radius:14px}
.flow-ic{width:40px;height:40px;border-radius:10px;background:var(--gold-soft);display:grid;place-items:center;margin-bottom:10px}
.flow-step b{font-family:'Space Grotesk',sans-serif;font-weight:600}
.flow-arrow{font-size:18px}
footer{padding:28px}
.demo-tag{background:var(--gold)}

/* ===== UI v2: keten, paneel, wizard ===== */
nav{align-items:center}
nav .nav-sp{flex:1}
nav .btn-add{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;margin:6px 0}
nav .btn-add:hover{background:#1a5fb4}
nav .btn-add .ico{stroke:#fff;width:18px;height:18px}
.kv-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.kv-head h1{margin:0 0 4px}
.kv-head .sub{margin:0}
.kv-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font:inherit;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.seg button:hover:not(.on){color:var(--ink);background:var(--bg)}
.zoek{position:relative}
.zoek input{padding-left:34px;width:220px;height:38px;margin:0}
.zoek .ico{position:absolute;left:10px;top:9px;width:18px;height:18px;stroke:var(--muted)}
.todo-band{background:var(--brand);color:#fff;border-radius:18px;padding:20px 24px;margin-bottom:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.todo-band .tb-t{flex:1;min-width:220px}
.todo-band .tb-k{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7fb3ff;margin-bottom:4px}
.todo-band h2{color:#fff;margin:0;font-size:21px}
.todo-band .tb-s{color:#c9d6ea;font-size:14px;margin-top:2px}
.todo-band .tb-acts{display:flex;gap:8px;flex-wrap:wrap}
.tb-chip{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border:0;border-radius:10px;padding:9px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.tb-chip:hover{background:var(--gold-soft)}
.tb-chip small{font-weight:500;color:var(--muted)}
.tb-chip .ico{width:17px;height:17px}
.keten{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:72px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px 26px}
.keten svg.kl{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.kl path{fill:none;stroke-width:2;stroke:#c3cfdf;transition:opacity .15s,stroke .15s}
.kl path.l-ok{stroke:#9fd0b2}.kl path.l-wait{stroke:#f0cf8f}.kl path.l-todo{stroke:#9cc3ef}.kl path.l-bad{stroke:#eaa79c}.kl path.l-done{stroke:#a9b8cf}
.kcol{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;min-width:0}
.kh{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;color:var(--ink);margin-bottom:4px}
.kh .ico{width:18px;height:18px}

<script>/* ===== Gedeelde logica (identiek in app en server) ===== */
function nl(n,d){ if(d===undefined)d=1; if(n===null||n===undefined||n===''||isNaN(n)) return '–'; return Number(n).toFixed(d).replace('.',','); }
function maakLogica(S,CFG){
const lot = id=>S.lots.find(l=>l.id===id);
const batch = id=>S.batches.find(b=>b.id===id);
const monstersVan = id=>S.monsters.filter(m=>m.ref===id);
const leverStatus = naam=>(S.leveranciers.find(l=>l.naam===naam)||{}).status||'Nieuw';
const gebruiktG = lotId=>S.batches.reduce((s,b)=>s+b.inzet.filter(i=>i.lot===lotId).reduce((a,i)=>a+Number(i.g),0),0);
const restG = lotId=>{ const l=lot(lotId); return l? Math.round((l.gram-gebruiktG(lotId))*100)/100 : 0; };
const geleverd = bId=>S.leveringen.filter(x=>x.batch===bId).reduce((s,x)=>s+Number(x.stuks),0);
const voorraad = bId=>{ const b=batch(bId); return b? b.stuks-geleverd(bId):0; };
const lotResultaat = lotId=>monstersVan(lotId).filter(m=>m.oordeel==='Conform').slice(-1)[0];
function vereistGrondstof(verp,lev){
let n = verp<=4 ? verp : Math.ceil(1+Math.sqrt(verp));
if(leverStatus(lev)==='Nieuw' && verp>4) n=Math.min(verp,Math.ceil(n*CFG.strengFactor));
return n;
}
const vereistVoor = ref=>{ if(ref.indexOf('GL')===0){const l=lot(ref);return vereistGrondstof(l.verp,l.leverancier);} return CFG.stuksEindproduct; };
const isCBD = b=>b&&b.cat==='CBD';
function theoretisch(b){
let mg=0, compleet=true; const k=isCBD(b)?'cbd':'thc';
b.inzet.forEach(i=>{ const r=lotResultaat(i.lot); if(r&&r[k]!=null) mg+= i.g*(r[k]/100)*1000; else compleet=false; });
return compleet&&b.stuks? mg/b.stuks : null;
}
/* Lijst II-dossier: alle controles voor vrijgave van een batch */
function dossierCBD(b){
const m = monstersVan(b.id).filter(x=>x.oordeel).slice(-1)[0];
const pending = monstersVan(b.id).find(x=>!x.oordeel);
const th = theoretisch(b), tol=Math.round(CFG.labelTolerantie*100);
const checks=[];
const lotsOk = b.inzet.every(i=>lot(i.lot)&&lot(i.lot).status==='Vrijgegeven');
checks.push({s:lotsOk?'ok':'bad',t:'Grondstof vrijgegeven',d:b.inzet.map(i=>i.lot+' ('+((lot(i.lot)||{}).status||'?')+')').join(', ')});
if(!m){
checks.push({s:'wait',t:'CBD binnen ±'+tol+' % van etiket',d:(pending?'Monster '+pending.id+' wacht op resultaat Allora Labs.':'Nog geen monster genomen.')+(th?' Verwacht max. '+nl(th)+' mg CBD/stuk.':'')});
checks.push({s:'wait',t:'THC onder de limiet',d:'Limiet: '+nl(CFG.cbdThcMax,2)+' mg THC per stuk'});
return {checks:checks,klaar:false,ok:false,m:m,th:th};
}
const dev=(m.cbdmg-b.label)/b.label;
checks.push({s:Math.abs(dev)<=CFG.labelTolerantie?'ok':'bad',t:'CBD binnen ±'+tol+' % van etiket',d:nl(m.cbdmg)+' mg CBD gemeten · etiket '+b.label+' mg ('+(dev>=0?'+':'')+nl(dev*100,0)+' %)'});
const thc=Number(m.mg)||0;
checks.push({s:thc<=CFG.cbdThcMax?'ok':'bad',t:'THC onder de limiet',d:(thc?nl(thc,2)+' mg THC per stuk':'THC niet aangetoond')+' · limiet '+nl(CFG.cbdThcMax,2)+' mg'});
const ok=checks.every(c=>c.s==='ok');
return {checks:checks,klaar:true,ok:ok,m:m,th:th};
}
function dossier(b){
if(isCBD(b)) return dossierCBD(b);
const m = monstersVan(b.id).filter(x=>x.oordeel).slice(-1)[0];
const pending = monstersVan(b.id).find(x=>!x.oordeel);
const th = theoretisch(b);
const checks=[];
const lotsOk = b.inzet.every(i=>lot(i.lot)&&lot(i.lot).status==='Vrijgegeven');
checks.push({s:lotsOk?'ok':'bad',t:'Grondstof vrijgegeven',d:b.inzet.map(i=>i.lot+' ('+((lot(i.lot)||{}).status||'?')+')').join(', ')});
if(!m){
const msg = pending? 'Monster '+pending.id+' wacht op resultaat Allora Labs.' : 'Nog geen monster genomen.';
checks.push({s:'wait',t:'PCR eindproduct: cannabis-RNA aangetoond',d:msg});
checks.push({s:'wait',t:'Massabalans grondstof → product',d: th? 'Maximaal '+nl(th)+' mg THC/stuk op basis van '+b.inzet.map(i=>i.g+' g '+i.lot).join(' + ')+'.':'—'});
checks.push({s:'wait',t:'Dosering binnen ±'+Math.round(CFG.labelTolerantie*100)+' % van etiket',d:'Etiket: '+b.label+' mg/stuk'});
return {checks:checks,klaar:false,ok:false,m:m,th:th};
}
checks.push({s:m.pcr==='Positief'?'ok':(m.pcr?'bad':'wait'),t:'PCR eindproduct: cannabis-RNA aangetoond',d:(m.pcr||'Nog in te voeren')+(m.ct?' · Ct '+nl(m.ct):'')+(m.rapport?' · rapport '+m.rapport:'')});
const ratio = th? m.mg/th : null;
let mbS='bad', mbD='';
if(ratio==null){ mbS='wait'; mbD='Kan niet berekenen: resultaat grondstof ontbreekt.'; }
else if(ratio>CFG.massabalansMax){ mbD='Gemeten '+nl(m.mg)+' mg vs. max. '+nl(th)+' mg uit de grondstof ('+nl(ratio*100,0)+' %). Meer THC dan de grondstof kan leveren: wijst op toegevoegd extract of een doseerfout.'; }
else if(ratio<CFG.massabalansMin){ mbD='Gemeten '+nl(m.mg)+' mg vs. '+nl(th)+' mg verwacht ('+nl(ratio*100,0)+' %). Groot verlies of doseerfout.'; }
else { mbS='ok'; mbD='Gemeten '+nl(m.mg)+' mg vs. max. '+nl(th)+' mg uit de grondstof ('+nl(ratio*100,0)+' %): past bij Lijst II-grondstof als enige THC-bron.'; }
checks.push({s:mbS,t:'Massabalans grondstof → product',d:mbD,ratio:ratio});
const dev = (m.mg-b.label)/b.label;
checks.push({s:Math.abs(dev)<=CFG.labelTolerantie?'ok':'bad',t:'Dosering binnen ±'+Math.round(CFG.labelTolerantie*100)+' % van etiket',d:nl(m.mg)+' mg gemeten · etiket '+b.label+' mg ('+(dev>=0?'+':'')+nl(dev*100,0)+' %)'});
const ok = checks.every(c=>c.s==='ok');
const wacht = !ok && !checks.some(c=>c.s==='bad');
return {checks:checks,klaar:!wacht,ok:ok,m:m,th:th,ratio:ratio};
}
return {isCBD,lot,batch,monstersVan,leverStatus,gebruiktG,restG,geleverd,voorraad,lotResultaat,vereistGrondstof,vereistVoor,theoretisch,dossier};
}
/* ===== Einde gedeelde logica ===== */
/* Gegevens voor het openbare productpaspoort (geen leveranciers, geen coffeeshops) */
function paspoortData(S,CFG,b){
const L=maakLogica(S,CFG), d=L.dossier(b), m=d.m||null;
return {id:b.id, code:b.code||'', product:b.product, datum:b.datum, status:b.status, cat:b.cat||'THC', label:b.label, cbdThcMax:CFG.cbdThcMax,
lots:b.inzet.map(i=>{ const l=L.lot(i.lot)||{}, r=L.lotResultaat(i.lot)||{}; return {type:l.type||'', datum:l.datum||'', oDatum:r.oDatum||'', thc:r.thc, cbd:r.cbd, cbn:r.cbn, pcr:r.pcr||'', ct:r.ct, rapport:r.rapport||'', link:r.link||''}; }),
m: m?{mg:m.mg, cbdmg:m.cbdmg, pcr:m.pcr||'', ct:m.ct, oDatum:m.oDatum||'', rapport:m.rapport||'', link:m.link||''}:null,
checks:d.checks.map(c=>({s:c.s,t:c.t}))};
}
</script>
<script>
/* ---------- Status en serververbinding ---------- */
let API = 'https://script.google.com/macros/s/AKfycby3ve1slVCUcRsuCM6uDAbTBXGx3azDjC3LAHFwtGLEtrZDSwml5VyjriW03ZytH-LQ/exec';
const _Q = new URLSearchParams(location.search);
const KCODE = (_Q.get('k')||'').replace(/[^A-Za-z0-9-]/g,'').toLowerCase();
const KLANTEN_URL = 'https://allora-traceability.github.io/paspoort/klanten.json';
let KLANT = {opties:{}};
const TKEY = 'allora-'+'trace-token'+(KCODE?'-'+KCODE:'');
const INIT_ID = (_Q.get('id')||'').replace(/[^A-Za-z0-9-]/g,'');
const P_CODE = (_Q.get('p')||'').replace(/[^A-Za-z0-9]/g,'');
let S=null, CFG={}, PRODUCTEN=[], GRONDSTOFTYPES=[], KLANTEN=[], BEMONSTERAARS=[];
let TOKEN=null; try{ TOKEN=localStorage.getItem(TKEY); }catch(e){}
let ROLE='producent', TAB=INIT_ID?'traceren':'overzicht', TRACE=INIT_ID||null, FILTER={}, BUSY=false;
const typeCat = n=>(GRONDSTOFTYPES.find(g=>g.naam===n)||{cat:'THC'}).cat;
const typeLabel = n=>typeCat(n)==='CBD'?'CBD':'Lijst II';
function setState(st){ S=st; CFG=S.cfg; PRODUCTEN=S.producten; GRONDSTOFTYPES=S.grondstoftypes; KLANTEN=S.klanten.map(k=>k.naam); BEMONSTERAARS=S.bemonsteraars; ROLE=S.user.rol; Object.assign(window, maakLogica(S,CFG)); }
function call(fn){ const args=[].slice.call(arguments,1); return fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).catch(()=>{throw new Error('Geen verbinding met de server. Probeer het opnieuw.');}).then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error); return j.result; }); }
function fout(e){ const msg=String((e&&e.message)||e).replace(/^(Error|Exception):\s*/,''); if(msg.indexOf('SESSIE_VERLOPEN')>=0){ TOKEN=null; try{localStorage.removeItem(TKEY);}catch(x){} closeModal(); toonLogin('Je sessie is verlopen. Log opnieuw in.'); } else toast(msg); }
async function laad(){ try{ setState(await call('getState',TOKEN)); toonApp(); }catch(e){ fout(e); if(!S) toonLogin(); } }
async function doe(type,p){
if(BUSY) return false; BUSY=true; document.body.classList.add('busy');
try{ const r=await call('actie',TOKEN,type,p); setState(r.state); closeModal(); render(); toast(r.msg); return true; }
catch(e){ fout(e); return false; }
finally{ BUSY=false; document.body.classList.remove('busy'); }
}
function toonLogin(msg){
S=null; document.body.classList.add('auth'); $('#userbox').innerHTML='';
$('#main').innerHTML=`<div class="login card"><h1>Inloggen</h1><p class="sub">Traceability door Allora Labs</p>${msg?`<div class="hint bad" style="margin-bottom:8px">${esc(msg)}</div>`:''}
<form id="lf" autocomplete="off"><label>PIN</label><input id="l_pin" type="password" inputmode="numeric" autofocus><div id="l_naam"></div>
<button class="btn" style="width:100%;margin-top:16px" id="l_btn">Verder</button></form></div>`;
$('#lf').onsubmit=async ev=>{
ev.preventDefault(); const pin=$('#l_pin').value.trim(); if(!pin) return toast('Vul je PIN in.');
const sel=$('#l_sel'), txt=$('#l_txt'); let naam='';
if(sel) naam = sel.value==='__ander' ? (txt?txt.value.trim():'') : sel.value; else if(txt) naam=txt.value.trim();
if((sel||txt)&&!naam) return toast('Kies of vul je naam in.');
$('#l_btn').disabled=true;
try{
const r=await call('login',pin,naam);
if(r.kiesNaam){
$('#l_naam').innerHTML = r.namen.length
? `<label>Wie ben je?</label><select id="l_sel" onchange="$('#l_txtw').style.display=this.value==='__ander'?'block':'none'">${opts(r.namen.concat([{v:'__ander',l:'Andere naam…'}]))}</select><div id="l_txtw" style="display:none"><input id="l_txt" placeholder="Je naam" style="margin-top:8px"></div>`
: `<label>Je naam</label><input id="l_txt" placeholder="Voor het logboek">`;
$('#l_btn').textContent='Inloggen';
} else {
TOKEN=r.token; try{ localStorage.setItem(TKEY,TOKEN); }catch(x){}
await laad();
}
}catch(e){ fout(e); }
if($('#l_btn')) $('#l_btn').disabled=false;
};
}
function toonApp(){
document.body.classList.remove('auth');
$('#userbox').innerHTML=`${S.demo?'<span class="demo-tag" style="color:#fff">DEMO</span>':''}<span>${esc(S.user.naam)} · ${ROLE==='allora'?'Allora Labs':'Producent'}</span><button class="btn ghost" onclick="uitloggen()">Uitloggen</button>`;
render();
}
function uitloggen(){ call('logout',TOKEN).catch(()=>{}); TOKEN=null; try{localStorage.removeItem(TKEY);}catch(x){} toonLogin(); }
async function toonPaspoortPubliek(){
document.body.classList.add('pp-mode','qr-scan','auth');
$('#main').innerHTML='<div class="empty" style="text-align:center;padding:40px">Productpaspoort laden…</div>';
try{ const P=await call('getPaspoort',P_CODE); $('#main').innerHTML=`<div class="pp-page">${paspoortHTML(P,false)}</div>`; }
catch(e){ $('#main').innerHTML=`<div class="pp-page"><div class="card"><h2>Productpaspoort niet gevonden</h2><p class="muted">${esc(String(e.message||e).replace(/^(Error|Exception):\s*/,''))}</p></div></div>`; }
}

/* ---------- Helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy = iso=> iso? iso.slice(8,10)+'-'+iso.slice(5,7)+'-'+iso.slice(0,4):'';
const today = ()=> new Date().toISOString().slice(0,10);
const chip = s=>`<span class="chip c-${String(s).replace(/\s/g,'')}">${esc(s)}</span>`;

let PASPOORT=null;
function openPaspoort(id){ PASPOORT=id; render(); }
function sluitPaspoort(){ PASPOORT=null; render(); }
function paspoortPagina(){
const b=batch(PASPOORT);
return `<div class="pp-page"><div class="pp-bar qr-hide"><button class="btn ghost" onclick="sluitPaspoort()">← Terug naar de app</button><span class="small muted">Zo ziet de coffeeshop of inspecteur het na het scannen</span></div>${b?paspoortHTML(paspoortData(S,CFG,b),false):'<div class="empty">Onbekende batch.</div>'}</div>`;
}
function goTrace(id){ TRACE=id; TAB='traceren'; render(); }
function alleIds(){ return [...S.batches.map(b=>b.id),...S.lots.map(l=>l.id)]; }
function traceren(){
if(!TRACE) TRACE=S.batches[0]?S.batches[0].id:null;
const sel=`<select onchange="goTrace(this.value)" style="max-width:340px">${alleIds().map(i=>`<option ${i===TRACE?'selected':''} value="${i}">${i} · ${esc(i.startsWith('PB')?batch(i).product:(lot(i).type+' · '+lot(i).soort))}</option>`).join('')}</select>`;
let body='';
if(TRACE&&TRACE.startsWith('PB')) body=traceBatch(batch(TRACE)); else if(TRACE) body=traceLot(lot(TRACE));
return `<h1>Traceren</h1><p class="sub">Kies een ID: herkomst, analyses en bestemming in één keer. De QR-code van een batch gaat op de verpakking en opent het productpaspoort.</p>
<div style="margin-bottom:14px">${sel}</div>${body}`;
}
function stepHTML(ic,title,inner,last){ return `<div class="step"><div class="rail"><div class="b">${ico(ic)}</div>${last?'':'<div class="ln"></div>'}</div><div class="body"><b>${title}</b>${inner}</div></div>`; }
function resultLine(m){
if(!m) return '<div class="minirow muted">Nog geen analyse.</div>';
if(!m.oordeel) return `<div class="minirow">${m.id} · genomen ${dmy(m.datum)} door ${esc(m.door)} · ${chip('Wacht op resultaat')}</div>`;
const cbdB = m.type==='Eindproduct'&&m.cbdmg!=null;
const v = m.type==='Grondstof'?`THC ${nl(m.thc)} % · CBD ${nl(m.cbd)} % · CBN ${nl(m.cbn)} %`:(cbdB?`CBD ${nl(m.cbdmg)} mg/stuk · THC ${m.mg?nl(m.mg,2)+' mg':'niet aangetoond'}`:`THC ${nl(m.mg)} mg/stuk`);
const cbdLot = m.type==='Grondstof'&&lot(m.ref)&&typeCat(lot(m.ref).type)==='CBD';
return `<div class="minirow">Rapport <b>${esc(m.rapport)}</b> · ${v} ${cbdB||(m.type==='Grondstof'&&!m.pcr)?'':` · PCR ${m.pcr||'<i>nog in te voeren</i>'}${m.ct?' (Ct '+nl(m.ct)+')':''}`} · ${chip(m.oordeel)}${m.extra?`<div class="small muted">${esc(m.extra)}</div>`:''}${m.notitie?`<div class="small muted">${esc(m.notitie)}</div>`:''}</div>`;
}
function traceBatch(b){
const d=dossier(b);
const lev=S.leveringen.filter(x=>x.batch===b.id);
const bar = !isCBD(b)&&d.th&&d.m? (()=>{const max=Math.max(d.m.mg,d.th*CFG.massabalansMax)*1.15;const p=v=>Math.min(100,v/max*100);return `<div class="small" style="margin-top:6px">Gemeten THC per stuk vs. wat de grondstof kan leveren</div><div class="bar"><div class="zone" style="left:${p(d.th*CFG.massabalansMin)}%;width:${p(d.th*CFG.massabalansMax)-p(d.th*CFG.massabalansMin)}%"></div><i style="width:${p(d.m.mg)}%;background:${d.checks[3]&&d.checks[3].s==='ok'?'var(--ok)':'var(--bad)'}"></i></div><div class="small muted">Groene zone: ${nl(d.th*CFG.massabalansMin)}–${nl(d.th*CFG.massabalansMax)} mg</div>`;})():'';
return `<div class="grid two">
<div class="card">
<div class="tracehead">
<div style="flex:1;min-width:220px"><h2 style="margin-bottom:6px">${b.id} ${chip(b.status)}</h2>
<dl class="kv"><dt>Product</dt><dd>${esc(b.product)}</dd><dt>Geproduceerd</dt><dd>${dmy(b.datum)}</dd><dt>Stuks</dt><dd>${b.stuks} (voorraad ${b.stuks-geleverd(b.id)})</dd><dt>Overige ingrediënten</dt><dd>${esc(b.overig)||'–'}</dd></dl>
</div>
<div style="text-align:center"><div class="qr" id="qr" title="QR-code voor het etiket" onclick="openPaspoort('${b.id}')" style="cursor:pointer"></div><button class="btn ghost" style="padding:6px 10px;font-size:12px;margin-top:6px" onclick="openPaspoort('${b.id}')">Productpaspoort</button><br><button class="btn ghost" style="padding:6px 10px;font-size:12px;margin-top:6px" onclick="kopieer('${b.id}')">Link voor etiket kopiëren</button></div>
</div>
<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
<div class="chain">
${stepHTML('leaf','Herkomst: grondstof',b.inzet.map(i=>{const l=lot(i.lot);return `<div class="minirow">${idl(i.lot)} · ${esc(l.soort)} · ${esc(l.type||'')} · ${i.g} g ingezet · ${esc(l.leverancier)} · ontvangen ${dmy(l.datum)} ${chip(l.status)}</div>${resultLine(lotResultaat(i.lot)||monstersVan(i.lot).slice(-1)[0])}`;}).join(''))}
${stepHTML('box','Productie',`<div class="minirow">${dmy(b.datum)} · ${b.stuks} × ${esc(b.product)} · max. ${d.th?nl(d.th)+' mg':'–'} ${isCBD(b)?'CBD':'THC'}/stuk uit de grondstof</div>`)}
${stepHTML('flask','Analyse eindproduct',resultLine(monstersVan(b.id).slice(-1)[0]))}
${stepHTML('truck','Bestemming',lev.length?lev.map(x=>`<div class="minirow">${dmy(x.datum)} · ${esc(x.klant)} · ${x.stuks} stuks · pakbon ${esc(x.bon)}${x.blind?' · blinde controle':''}</div>`).join(''):'<div class="minirow muted">Nog niet geleverd.</div>',true)}
</div>
</div>
<div class="card">
<h2>${isCBD(b)?'CBD-dossier':'Lijst II-dossier'}</h2>
<p class="small muted" style="margin-top:-6px">${isCBD(b)?'Toont aan dat het CBD-gehalte klopt en THC onder de limiet blijft.':'Toont aan dat deze batch van Lijst II-grondstof is gemaakt en niet van een solvent-extract (Lijst I).'}</p>
${d.checks.map(c=>`<div class="check"><div class="dot ${c.s}">${c.s==='ok'?'✓':c.s==='bad'?'✕':'…'}</div><div><b>${c.t}</b><div class="small muted">${esc(c.d)}</div></div></div>`).join('')}
${bar}
<div class="hint ${d.klaar?(d.ok?'ok':'bad'):''}">${d.klaar?(d.ok?'<b>Vrijgegeven.</b> Alle controles geslaagd; batch mag geleverd worden.':'<b>Geblokkeerd.</b> Minstens één controle faalt; levering is niet mogelijk.'):'<b>In afwachting.</b> Batch kan pas geleverd worden na vrijgave.'}</div>
</div>
</div>`;
}
function traceLot(l){
const bs=S.batches.filter(b=>b.inzet.some(i=>i.lot===l.id));
const lev=S.leveringen.filter(x=>bs.some(b=>b.id===x.batch));
const shops=[...new Set(lev.map(x=>x.klant))];
return `<div class="grid two">
<div class="card">
<div class="tracehead">
<div style="flex:1;min-width:220px"><h2 style="margin-bottom:6px">${l.id} ${chip(l.status)}</h2>
<dl class="kv"><dt>Grondstof</dt><dd>${esc(l.type||'')} (${typeLabel(l.type)}) · ${esc(l.soort)}</dd><dt>Leverancier</dt><dd>${esc(l.leverancier)} (${leverStatus(l.leverancier)})</dd><dt>Ontvangen</dt><dd>${dmy(l.datum)} · ${l.gram} g · ${l.verp} verp.</dd><dt>Restant</dt><dd>${restG(l.id)} g</dd></dl></div>

<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">

${stepHTML('flask','Analyse grondstof',monstersVan(l.id).map(resultLine).join('')||resultLine(null))}
${stepHTML('box','Gebruikt in batches',bs.length?bs.map(b=>`<div class="minirow">${idl(b.id)} · ${esc(b.product)} · ${b.inzet.filter(i=>i.lot===l.id).reduce((s,i)=>s+i.g,0)} g · ${chip(b.status)}</div>`).join(''):'<div class="minirow muted">Nog niet gebruikt.</div>')}
${stepHTML('truck','Bestemming',lev.length?lev.map(x=>`<div class="minirow">${dmy(x.datum)} · ${esc(x.klant)} · ${x.stuks} stuks uit ${x.batch}</div>`).join(''):'<div class="minirow muted">Geen leveringen.</div>',true)}
</div>
</div>
<div class="card">
<h2>Terugroepoverzicht</h2>
<p class="small muted" style="margin-top:-6px">Als er iets mis is met deze partij: wie moet gebeld worden?</p>
<dl class="kv"><dt>Batches</dt><dd>${bs.length}</dd><dt>Stuks geleverd</dt><dd>${lev.reduce((s,x)=>s+x.stuks,0)}</dd><dt>Stuks op voorraad</dt><dd>${bs.reduce((s,b)=>s+b.stuks-geleverd(b.id),0)}</dd></dl>
<div style="margin-top:12px">${shops.length?shops.map(s=>`<div class="minirow">${esc(s)}</div>`).join(''):'<div class="empty">Geen coffeeshops betrokken.</div>'}</div>
</div>
</div>`;
}
function qrUrl(id){ const b=id.indexOf('PB')===0?batch(id):null, kq=KCODE?'&k='+KCODE:''; return b&&b.code? String(S.paspoortUrl||S.appUrl).split('?')[0]+'?p='+b.code+kq : String(S.appUrl).split('?')[0]+'?id='+id+kq; }
function kopieer(id){ const u=qrUrl(id); try{ navigator.clipboard.writeText(u).then(()=>toast('Link gekopieerd'),()=>prompt('Kopieer de link:',u)); }catch(e){ prompt('Kopieer de link:',u); } }
function drawQR(){

try{ const q=qrcode(0,'M'); q.addData(qrUrl(TRACE)); q.make(); el.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true}); }catch(e){}
}

if((isCBD(b)&&$('#r_cbdmg').value==='')||(!isCBD(b)&&$('#r_mg').value==='')){ h.className='hint'; h.innerHTML='Vul de resultaten in; de app beoordeelt de batch automatisch.'; return; }

/* ===== UI v2: Mijn keten, zijpaneel, stap-voor-stap toevoegen, overzichten ===== */
let OV='leveringen', KF='actief', KQ='', PANEEL=null, WIZ=null, AVIEW='rap';
const ST_IC={ok:'check',wait:'clock',todo:'arrowr',bad:'x',done:'check'};
const stHTML = s=>`<span class="st st-${s.k}">${ico(ST_IC[s.k])}${esc(s.t)}</span>`;
function groet(){ const h=new Date().getHours(); return h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond'; }
function bLots(b){ return b.inzet.map(i=>i.lot).filter((v,i,a)=>a.indexOf(v)===i); }
function bShops(b){ return S.leveringen.filter(x=>x.batch===b.id).map(x=>x.klant).filter((v,i,a)=>a.indexOf(v)===i); }
function stLot(l){
if(l.status==='Afgekeurd') return {k:'bad',t:'Afgekeurd'};
if(l.status==='Quarantaine'){
if(monstersVan(l.id).some(m=>!m.oordeel)) return ROLE==='allora'?{k:'wait',t:'Wacht op uitslag lab',act:`uitslagVoor('${l.id}')`,actT:'Uitslag invoeren'}:{k:'wait',t:'Wacht op uitslag lab'};
return {k:'todo',t:'In quarantaine',act:`fMonster('${l.id}')`,actT:'Monster nemen'};
}
if(restG(l.id)<=0) return {k:'done',t:'Opgebruikt'};
return {k:'ok',t:'Vrijgegeven',act:`wizStart('batch')`,actT:'Batch maken'};
}
function stBatch(b){
if(b.status==='Geblokkeerd') return {k:'bad',t:'Geblokkeerd'};
if(b.status==='In afwachting') return {k:'todo',t:'Nog niet getest',act:`fMonster('${b.id}')`,actT:'Monster nemen'};
if(b.status==='Bemonsterd') return ROLE==='allora'?{k:'wait',t:'Wacht op uitslag lab',act:`uitslagVoor('${b.id}')`,actT:'Uitslag invoeren'}:{k:'wait',t:'Wacht op uitslag lab'};
if(b.stuks-geleverd(b.id)<=0) return {k:'done',t:'Alles geleverd'};
return {k:'ok',t:'Vrijgegeven',act:`wizStart('levering','${b.id}')`,actT:'Leveren'};
}
function lotArch(l){
const bs=S.batches.filter(b=>b.inzet.some(i=>i.lot===l.id));
const klaar=l.status==='Afgekeurd'||(l.status==='Vrijgegeven'&&restG(l.id)<=0);
return klaar&&bs.every(b=>b.status==='Geblokkeerd'||(b.status==='Vrijgegeven'&&b.stuks-geleverd(b.id)<=0));
}
const batchArch = b=>bLots(b).every(id=>lot(id)&&lotArch(lot(id)));
function zoekMatch(txt){ return !KQ||txt.toLowerCase().indexOf(KQ.toLowerCase())>=0; }
function ketenData(){
const toon = arch=>KF==='alles'||(KF==='archief'?arch:!arch);
let lots=S.lots.filter(l=>toon(lotArch(l)));
let bs=S.batches.filter(b=>toon(batchArch(b)));
if(KQ){
const hitL=new Set(lots.filter(l=>zoekMatch([l.id,l.type,l.soort,l.leverancier].join(' '))).map(l=>l.id));
const hitB=new Set(bs.filter(b=>zoekMatch([b.id,b.product].join(' '))||bShops(b).some(zoekMatch)).map(b=>b.id));
bs.forEach(b=>{ if(bLots(b).some(id=>hitL.has(id))) hitB.add(b.id); });
bs=bs.filter(b=>hitB.has(b.id));
bs.forEach(b=>bLots(b).forEach(id=>hitL.add(id)));
lots=lots.filter(l=>hitL.has(l.id));
}
const nB=id=>bs.filter(b=>bLots(b).indexOf(id)>=0).length, pr=l=>['todo','wait'].indexOf(stLot(l).k)>=0?0:nB(l.id)?1:2;
lots.sort((a,b)=>(pr(a)-pr(b))||(nB(b.id)-nB(a.id))||(b.datum>a.datum?1:-1));
const li=id=>{const i=lots.findIndex(l=>l.id===id);return i<0?999:i;};
bs.sort((a,b)=>(Math.min(...bLots(a).map(li))-Math.min(...bLots(b).map(li)))||(a.datum>b.datum?1:-1));
const shops=[]; bs.forEach(b=>bShops(b).forEach(s=>{ if(shops.indexOf(s)<0) shops.push(s); }));
return {lots,bs,shops};
}
function rels(id){
const r=new Set([id]);
const addB=b=>{ r.add(b.id); bLots(b).forEach(x=>r.add(x)); bShops(b).forEach(s=>r.add('S:'+s)); };
if(id.indexOf('S:')===0) S.batches.filter(b=>bShops(b).indexOf(id.slice(2))>=0).forEach(addB);
else if(id.indexOf('GL')===0) S.batches.filter(b=>bLots(b).indexOf(id)>=0).forEach(addB);
else { const b=batch(id); if(b) addB(b); }
return [...r];
}
function kaartLot(l){
const s=stLot(l), rest=restG(l.id), pct=l.gram?Math.max(0,Math.min(100,rest/l.gram*100)):0;
const res=lotResultaat(l.id);
return `<div class="kc k-${s.k} ${lotArch(l)?'arch':''}" tabindex="0" data-id="${l.id}" onclick="openPaneel('${l.id}')" onkeydown="if(event.key==='Enter')openPaneel('${l.id}')">
<div class="kc-top"><div class="kc-ic">${ico(typeCat(l.type)==='CBD'?'drop':'leaf')}</div><div class="kc-t"><b>${esc(l.type)}${l.soort?' · '+esc(l.soort):''}</b><span>${l.id} · ${esc(l.leverancier)}</span></div></div>
<div class="kc-bar"><i style="width:${pct}%"></i></div><div class="kc-bl">${nl(rest,0)} g van ${nl(l.gram,0)} g over${res&&res.thc!=null?' · THC '+nl(res.thc)+' %':''}</div>
<div class="kc-foot">${stHTML(s)}${s.act?`<button class="kc-act" onclick="event.stopPropagation();${s.act}">${s.actT}</button>`:''}</div></div>`;
}
function kaartBatch(b){
const s=stBatch(b), gel=geleverd(b.id), pct=b.stuks?Math.min(100,gel/b.stuks*100):0, m=monstersVan(b.id).filter(x=>x.oordeel).slice(-1)[0];
const meet = m?(isCBD(b)?nl(m.cbdmg)+' mg CBD':nl(m.mg)+' mg THC')+' per stuk':'Etiket '+b.label+' mg';
return `<div class="kc k-${s.k} ${batchArch(b)?'arch':''}" tabindex="0" data-id="${b.id}" onclick="openPaneel('${b.id}')" onkeydown="if(event.key==='Enter')openPaneel('${b.id}')">
<div class="kc-top"><div class="kc-ic">${ico(isCBD(b)?'drop':'box')}</div><div class="kc-t"><b>${esc(b.product)}</b><span>${b.id} · ${dmy(b.datum)}</span></div></div>
<div class="kc-bar"><i style="width:${pct}%;background:${s.k==='bad'?'var(--bad)':'var(--gold)'}"></i></div><div class="kc-bl">${gel} van ${b.stuks} geleverd · ${meet}</div>
<div class="kc-foot">${stHTML(s)}${s.act?`<button class="kc-act" onclick="event.stopPropagation();${s.act}">${s.actT}</button>`:''}</div></div>`;
}
function kaartShop(naam,bs){
const lev=S.leveringen.filter(x=>x.klant===naam&&bs.some(b=>b.id===x.batch));
const st=lev.reduce((s,x)=>s+Number(x.stuks),0);
const prods=[...new Set(lev.map(x=>(batch(x.batch)||{}).product))];
const laatst=lev.map(x=>x.datum).sort().slice(-1)[0];
return `<div class="kc" tabindex="0" data-id="S:${esc(naam)}" onclick="openPaneel('S:${esc(naam)}')" onkeydown="if(event.key==='Enter')openPaneel('S:${esc(naam)}')">
<div class="kc-top"><div class="kc-ic">${ico('shop')}</div><div class="kc-t"><b>${esc(naam)}</b><span>${st} stuks · laatst ${dmy(laatst)}</span></div></div>
<div class="ks-chips">${prods.map(p=>`<span>${esc(p)}</span>`).join('')}</div></div>`;
}
function todoItems(){
const it=[];
S.lots.forEach(l=>{ const s=stLot(l); if(s.act&&(s.k==='todo'||(ROLE==='allora'&&s.k==='wait'))) it.push({id:l.id,t:l.type+(l.soort?' · '+l.soort:''),s}); });
S.batches.forEach(b=>{ const s=stBatch(b); if(s.act&&(s.k==='todo'||(ROLE==='allora'&&s.k==='wait'))) it.push({id:b.id,t:b.product,s}); });
return it;
}

function tekenLijnen(){
const k=$('#keten'), svg=$('#kl'); if(!k||!svg) return;
if(getComputedStyle(svg).display==='none') return;
const kr=k.getBoundingClientRect(), pos=id=>{ const e=k.querySelector(`[data-id="${CSS.escape(id)}"]`); if(!e) return null; const r=e.getBoundingClientRect(); return {l:r.left-kr.left,r:r.right-kr.left,y:r.top-kr.top+Math.min(32,r.height/2)}; };
const lijn=(a,b,cls,ids)=>{ const p=pos(a),q=pos(b); if(!p||!q) return ''; const x1=p.r,x2=q.l,dx=(x2-x1)/2; return `<path class="${cls}" data-a="${esc(a)}" data-b="${esc(b)}" d="M${x1} ${p.y} C${x1+dx} ${p.y} ${x2-dx} ${q.y} ${x2} ${q.y}"/>`; };
let h='';
[...k.querySelectorAll('.kc[data-id^="PB"]')].forEach(e=>{ const b=batch(e.dataset.id); if(!b) return; const c='l-'+stBatch(b).k;
bLots(b).forEach(l=>h+=lijn(l,b.id,c)); bShops(b).forEach(s=>h+=lijn(b.id,'S:'+s,c)); });
svg.innerHTML=h;
k.querySelectorAll('.kc').forEach(e=>{
e.onmouseenter=()=>{ const r=new Set(rels(e.dataset.id)); k.classList.add('dim'); k.querySelectorAll('.kc').forEach(x=>x.classList.toggle('hl',r.has(x.dataset.id))); svg.querySelectorAll('path').forEach(p=>p.classList.toggle('hl',r.has(p.dataset.a)&&r.has(p.dataset.b))); };
e.onmouseleave=()=>{ k.classList.remove('dim'); k.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl')); };
});
}
window.addEventListener('resize',()=>{ if(TAB==='keten') tekenLijnen(); });

function sluitPaneel(){ PANEEL=null; const p=$('#pn'); if(p) p.classList.remove('open'); }
function toonPaneel(id,stil){
let p=$('#pn'); if(!p){ p=document.createElement('div'); p.id='pn'; p.className='pn'; p.innerHTML='<div class="pn-bg" onclick="sluitPaneel()"></div><aside class="pn-in" role="dialog" aria-modal="true" aria-labelledby="pn-t"></aside>'; document.body.appendChild(p); document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&PANEEL) sluitPaneel(); }); }
const h=paneelHTML(id); if(!h){ sluitPaneel(); return; }
p.querySelector('.pn-in').innerHTML=h;
if(!p.classList.contains('open')) requestAnimationFrame(()=>p.classList.add('open'));
drawQRs();
}

function wizStart(kind,pre){
sluitPaneel();
if(!kind){
modal(`<div class="wz-top"><div class="wz-k"><b>Toevoegen</b></div></div><div class="wz-body"><h2 class="wz-q">Wat wil je vastleggen?</h2><p class="wz-h">Kies wat er is gebeurd. Je krijgt daarna steeds één vraag.</p>

<button class="wz-o" onclick="wizStart('batch')"><div class="ic">${ico('box')}</div><div><b>Batch gemaakt</b><small>Edibles geproduceerd van vrijgegeven grondstof</small></div></button>
<button class="wz-o" onclick="wizStart('levering')"><div class="ic">${ico('truck')}</div><div><b>Levering</b><small>Producten naar een coffeeshop gebracht</small></div></button></div>
<div class="wz-more"><a onclick="closeModal();fMonster()">Monster genomen</a>${ROLE==='allora'?'<a onclick="closeModal();fResultaat()">Uitslag invoeren</a>':''}<a onclick="closeModal();fCorrectie()">Iets corrigeren</a></div></div>
<div class="wz-foot"><span></span><button class="btn ghost" onclick="closeModal()">Annuleren</button></div>`);
$('#modal').classList.add('wz'); return;
}
if(kind==='batch'&&!S.lots.some(l=>l.status==='Vrijgegeven'&&restG(l.id)>0)) return toast('Er is nog geen vrijgegeven grondstof. Eerst moet Allora Labs de grondstof goedkeuren.');

WIZ={kind,i:0,d:{}};
if(kind==='levering'&&pre){ WIZ.d.batch=pre; WIZ.d.stuks=batch(pre).stuks-geleverd(pre); WIZ.skipBatch=true; }
wizRender();
}
