<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productpaspoort · Traceability door Allora Labs</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f5f3ee;--ink:#1d2a2e;--muted:#6b7679;--line:#e4e0d6;--gold:#1f6fd1;--ok:#2f7d4f;--ok-soft:#e3f2e8;--warn:#b7791f;--warn-soft:#fbf1dc;--bad:#b8402f;--bad-soft:#f8e3df}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
main{max-width:440px;margin:0 auto;padding:16px}
.pp{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:14px}
.demo{background:var(--gold);color:#fff;text-align:center;font-size:12px;font-weight:700;padding:4px}
.pp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.pp-head img{height:34px}.pp-lbl{font-size:11px;font-weight:700;color:var(--gold);text-align:right}.pp-lbl span{color:var(--muted);font-weight:500}
.pp-stat{display:flex;gap:12px;align-items:center;padding:14px 16px;margin:12px;border-radius:12px}
.pp-stat.ok{background:var(--ok-soft);color:var(--ok)}.pp-stat.bad{background:var(--bad-soft);color:var(--bad)}.pp-stat.wait{background:var(--warn-soft);color:var(--warn)}
.pp-stat b{display:block;font-size:15px}.pp-stat span{font-size:12px}
.pp-big{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:20px;font-weight:800;color:#fff}
.ok .pp-big{background:var(--ok)}.bad .pp-big{background:var(--bad)}.wait .pp-big{background:var(--warn)}
.pp-sec{padding:10px 16px;border-top:1px solid var(--line)}
.pp-prod{font-size:18px;font-weight:700}.pp-sub{color:var(--muted);font-size:12.5px}
.pp-h{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.pp-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px}.pp-row span{color:var(--muted)}.pp-row b{text-align:right}.pp-row b.g{color:var(--ok)}.pp-row small{color:var(--muted);font-weight:400;display:block}
.pp-t{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:3px 0}.pp-t i{width:9px;height:9px;border-radius:50%;background:var(--gold)}.pp-t span{color:var(--muted)}
.foot{font-size:11.5px;color:var(--muted)}
.msg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}
</style></head><body><main id="m"><div class="msg">Productpaspoort laden…</div></main>
