:root{--bg:#f5f7fb;--ink:#14233a;--muted:#4a5568;--line:#dde4ee;--blue:#1f6fd1;--blue-soft:#e8f1fc;--navy:#14233a;--ok:#2f7d4f;--ok-soft:#e3f2e8;--warn:#b7791f;--warn-soft:#fbf1dc;--bad:#b8402f;--bad-soft:#f8e3df}
*{box-sizing:border-box}body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
main{max-width:460px;margin:0 auto;padding:16px 16px 28px}
.demo{background:var(--blue);color:#fff;text-align:center;font-size:12px;font-weight:600;letter-spacing:.06em;padding:5px;border-radius:10px;margin-bottom:12px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px}
.top img{height:36px;display:block}
.kick{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);text-align:right}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:22px 22px 20px}
.hero .kick{text-align:left;color:#7fb3ff;margin-bottom:8px}
.prod{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;line-height:1.15;margin:0}
.sub{color:#c9d6ea;font-size:13px;margin-top:4px}
.stat{display:flex;gap:12px;align-items:center;margin-top:18px;padding:12px 14px;border-radius:14px;background:#fff}
.stat b{display:block;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px}.stat span{font-size:12.5px;color:var(--muted)}
.big{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.big svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.stat.ok b{color:var(--ok)}.stat.ok .big{background:var(--ok)}.stat.bad b{color:var(--bad)}.stat.bad .big{background:var(--bad)}.stat.wait b{color:var(--warn)}.stat.wait .big{background:var(--warn)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:12px}
.h{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin:0 0 8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.row span{color:var(--muted)}.row b{text-align:right;font-weight:600}.row b.g{color:var(--ok)}.row small{color:var(--muted);font-weight:400;display:block;font-size:12px}
.t{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:6px 0;position:relative}
.t i{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}.t span{color:var(--muted)}.t b{font-weight:600}
.lab{display:flex;gap:12px;align-items:center;font-size:12.5px;color:var(--muted)}
.lab .ic{width:38px;height:38px;border-radius:10px;background:var(--blue-soft);display:grid;place-items:center;flex:none}
.lab .ic svg{width:20px;height:20px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lab b{color:var(--ink);font-weight:600;display:block;font-size:13.5px}
.msg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted);margin-top:40px}
.rl{color:inherit;text-decoration:none;border-bottom:1.5px dotted var(--blue);display:inline-flex;align-items:center;gap:4px}.rl svg{width:14px;height:14px;fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.rl:hover{color:var(--blue)}
.docs a{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}.docs a:last-child{border-bottom:0}.docs a:hover b{color:var(--blue)}.docs .di{width:34px;height:34px;border-radius:9px;background:var(--blue-soft);display:grid;place-items:center;flex:none}.docs .di svg{width:18px;height:18px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.docs b{display:block;font-weight:600}.docs small{color:var(--muted)}.hint{font-size:12px;color:var(--muted);margin-top:8px}
.msg b{display:block;color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:18px;margin-bottom:4px}
